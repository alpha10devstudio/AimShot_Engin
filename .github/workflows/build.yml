name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK on Ubuntu Runner
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi
        if [ -f "AimShot_Project/gradlew" ]; then
          chmod +x AimShot_Project/gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "settings.gradle" ] && [ -f "gradlew" ]; then
          echo "Building from root directory..."
          ./gradlew assembleDebug --stacktrace
        elif [ -d "AimShot_Project" ] && [ -f "AimShot_Project/settings.gradle" ]; then
          echo "Building from AimShot_Project directory..."
          cd AimShot_Project
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          AimShot_Project/app/build/outputs/apk/debug/*.apk
          AimShot-Engine-v1.0.0.apk
        if-no-files-found: warn
