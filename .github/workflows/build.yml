name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK on Ubuntu Runner
    runs-on: ubuntu-latest

    steps:
    # ১. গিটহাব থেকে প্রজেক্টের সোর্স কোড ডাউনলোড বা চেকআউট করা
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ২. অ্যান্ড্রয়েড বিল্ডের জন্য প্রয়োজনীয় জাভা (JDK 17) এনভায়রনমেন্ট সেটআপ করা
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # ৩. অ্যান্ড্রয়েড এসডিকে লাইসেন্সগুলো স্বয়ংক্রিয়ভাবে অনুমোদন করানো
    - name: Accept Android SDK Licenses
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo "24330f8a81638363azd8c51923485f541240c492" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648b0" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo "84831b4009041f6a626245041a5482f5ec3a42fa" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        yes | sdkmanager --licenses || true

    # ৪. গ্র্যাডল র‍্যাপার ফাইলে এক্সিকিউট পারমিশন দেওয়া
    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi
        if [ -f "AimShot_Project/gradlew" ]; then
          chmod +x AimShot_Project/gradlew
        fi

    # ৫. সঠিক ডিরেক্টরিতে ঢুকে Gradle 8.4 র‍্যাপার নিশ্চিত করে ডিবাগ এপিকে (Debug APK) বিল্ড করা
    - name: Build Debug APK
      run: |
        cd AimShot_Project
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle wrapper with version 8.4..."
          gradle wrapper --gradle-version 8.4
        fi
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace

    # ৬. বিল্ড হওয়া এপিকে ফাইলটিকে গিটহাব আর্কিটেক্ট হিসেবে আপলোড করা
    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          AimShot_Project/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
