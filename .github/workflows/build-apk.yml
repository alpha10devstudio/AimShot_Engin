name: Build Android APK

on:
push:
branches:
- ""
pull_request:
branches:
- ""
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build APK on Ubuntu Runner
runs-on: ubuntu-latest

steps:
  # ১. GitHub repository থেকে source code checkout
  - name: Checkout Repository
    uses: actions/checkout@v4

  # ২. Java JDK 17 সেটআপ
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      java-version: "17"
      distribution: temurin
      cache: gradle

  # ৩. Android SDK environment ও licenses সেটআপ
  - name: Accept Android SDK Licenses
    run: |
      export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      mkdir -p "$ANDROID_HOME/licenses"

      touch "$ANDROID_HOME/licenses/android-sdk-license"

      for license in \
        24330f8a81638363azd8c51923485f541240c492 \
        d56f5187479451eabf01fb78af6dfcb131a648b0 \
        84831b4009041f6a626245041a5482f5ec3a42fa
      do
        grep -qxF "$license" "$ANDROID_HOME/licenses/android-sdk-license" \
          || echo "$license" >> "$ANDROID_HOME/licenses/android-sdk-license"
      done

      if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      elif command -v sdkmanager >/dev/null 2>&1; then
        yes | sdkmanager --licenses || true
      fi

  # ৪. Android project directory নির্ধারণ
  - name: Detect Android Project
    id: project
    shell: bash
    run: |
      if [ -d "AimShot_Project" ] && \
         { [ -f "AimShot_Project/settings.gradle" ] || \
           [ -f "AimShot_Project/settings.gradle.kts" ]; }; then
        echo "dir=AimShot_Project" >> "$GITHUB_OUTPUT"
      elif [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
        echo "dir=." >> "$GITHUB_OUTPUT"
      else
        echo "::error::Android Gradle project not found. Check settings.gradle or settings.gradle.kts."
        exit 1
      fi

  # ৫. Gradle Wrapper প্রস্তুত করা
  - name: Setup Gradle Wrapper
    working-directory: ${{ steps.project.outputs.dir }}
    shell: bash
    run: |
      if [ -f "gradlew" ]; then
        chmod +x gradlew

      elif [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
        echo "::error::Gradle wrapper properties exist, but gradlew is missing."
        exit 1

      else
        echo "Gradle wrapper not found. Generating Gradle 8.4 wrapper."

        mkdir -p gradle/wrapper

        cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
      distributionBase=GRADLE_USER_HOME
      distributionPath=wrapper/dists
      distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
      zipStoreBase=GRADLE_USER_HOME
      zipStorePath=wrapper/dists
      EOF

        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
      fi

  # ৬. Debug APK বিল্ড
  - name: Build Debug APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: ./gradlew assembleDebug --stacktrace

  # ৭. তৈরি হওয়া APK খুঁজে বের করা
  - name: Locate Generated APKs
    id: find_apk
    shell: bash
    run: |
      PROJECT_DIR="${{ steps.project.outputs.dir }}"

      {
        echo "apk_paths<<EOF"

        find "$PROJECT_DIR" -type f \
          -path "*/build/outputs/apk/*/*.apk" \
          -print | sort

        echo "EOF"
      } >> "$GITHUB_OUTPUT"

      APK_COUNT=$(find "$PROJECT_DIR" -type f \
        -path "*/build/outputs/apk/*/*.apk" | wc -l)

      if [ "$APK_COUNT" -eq 0 ]; then
        echo "::error::No APK files were generated."
        exit 1
      fi

      echo "Found $APK_COUNT APK file(s)."

  # ৮. সব তৈরি হওয়া APK Artifact হিসেবে আপলোড
  - name: Upload Android APK Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: AimShot-Engine-APK
      path: |
        ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
        AimShot-Engine-v1.0.0.apk
      if-no-files-found: warn
      retention-days: 30
