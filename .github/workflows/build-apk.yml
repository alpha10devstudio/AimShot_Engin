name: Build AimShot Engine Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "AimShot_Project/gradlew" ]; then
            chmod +x AimShot_Project/gradlew
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "AimShot_Project" ] && [ -f "AimShot_Project/settings.gradle" ]; then
            cd AimShot_Project
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --stacktrace
            else
              gradle assembleDebug --stacktrace
            fi
          elif [ -f "settings.gradle" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimShot-Engine-APK
          path: |
            AimShot_Project/app/build/outputs/apk/debug/*.apk
            AimShot_Project/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            AimShot-Engine-v1.0.0.apk
          if-no-files-found: warn
          retention-days: 30
