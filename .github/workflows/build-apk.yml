name: Build Android APK
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে প্রজেক্টের সোর্স কোড ডাউনলোড বা চেকআউট করা
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ২. অ্যান্ড্রয়েড বিল্ডের জন্য প্রয়োজনীয় জাভা (JDK 17) এনভায়রনমেন্ট সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ৩. অ্যান্ড্রয়েড এসডিকে লাইসেন্সগুলো স্বয়ংক্রিয়ভাবে অনুমোদন করানো
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ৪. গ্র্যাডল র‍্যাপার ফাইল মিসিং থাকলে তা স্বয়ংক্রিয়ভাবে তৈরি ও কনফিগার করা
      - name: Setup Gradle Wrapper Properly
        run: |
          TARGET_DIR="."
          if [ -d "AimShot_Project" ]; then
            TARGET_DIR="AimShot_Project"
          fi
          
          cd "$TARGET_DIR"
          mkdir -p gradle/wrapper
          
          # gradle-wrapper.properties ফাইল না থাকলে তৈরি করা
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
            echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
            echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
            echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          fi
          
          # gradlew না থাকলে গ্র্যাডল র‍্যাপার বাইনারি জেনারেট করা
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          
          # এক্সিকিউট পারমিশন নিশ্চিত করা
          chmod +x gradlew

      # ৫. অ্যান্ড্রয়েড ডিবাগ এপিকে (Debug APK) বিল্ড করা
      - name: Build Android Debug APK
        run: |
          if [ -d "AimShot_Project" ] && [ -f "AimShot_Project/settings.gradle" ]; then
            cd AimShot_Project
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --stacktrace
            else
              gradle assembleDebug --stacktrace
            fi
          elif [ -f "settings.gradle" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      # ৬. জেনারেটেড এপিকে ফাইল খুঁজে বের করা ও আর্কিটেক্ট হিসেবে আপলোড করা
      - name: Locate and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimShot-Engine-APK
          path: |
            AimShot_Project/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
