name: Build Android APK
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK Package
    runs-on: ubuntu-latest

    steps:
      # ১. গিটহাব থেকে প্রজেক্টের সোর্স কোড ডাউনলোড বা চেকআউট করা
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ২. অ্যান্ড্রয়েড বিল্ডের জন্য প্রয়োজনীয় জাভা (JDK 17) এনভায়রনমেন্ট সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ৩. অ্যান্ড্রয়েড এসডিকে লাইসেন্সগুলো স্বয়ংক্রিয়ভাবে অনুমোদন করানো
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ৪. গ্র্যাডল র‍্যাপার ফাইল মিসিং থাকলে তা স্বয়ংক্রিয়ভাবে তৈরি ও কনফিগার করা
      # ৪. ফিক্সড গ্র্যাডল ৮.৭ র‍্যাপার কনফিগারেশন এবং জেনারেশন (স্টেবল ভার্সন)
      - name: Setup Gradle Wrapper Properly
        run: |
          TARGET_DIR="."
          if [ -d "AimShot_Project" ]; then
            TARGET_DIR="AimShot_Project"
          fi
          
          cd "$TARGET_DIR"
          mkdir -p gradle/wrapper
          
          # Gradle 8.7 প্রোপার্টিজ ফাইল সেট করা (যা সব অ্যান্ড্রয়েড প্রজেক্টে নিখুঁতভাবে কাজ করে)
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          
          # নির্দিষ্ট করে Gradle 8.7 র‍্যাপার বাইনারি জেনারেট করা
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          
          # এক্সিকিউট পারমিশন নিশ্চিত করা
          chmod +x gradlew

      # ৪.৫. স্থায়ী রিলিজ কিটস্টোর কনফিগারেশন (সিক্রেটস অথবা পার্মানেন্ট ফাইল থেকে)
      - name: Setup Permanent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TARGET_DIR="."
          if [ -d "AimShot_Project" ]; then
            TARGET_DIR="AimShot_Project"
          fi
          cd "$TARGET_DIR"
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/aimshot-release.p12
            echo "Permanent release keystore restored from GitHub Secret KEYSTORE_BASE64."
          fi
          if [ ! -f "keystore/aimshot-release.p12" ]; then
            echo "ERROR: Permanent release keystore (keystore/aimshot-release.p12) is missing! Refusing to generate a new release keystore to preserve signing certificate identity."
            exit 1
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ৫. অ্যান্ড্রয়েড রিলিজ এবং ডিবাগ এপিকে বিল্ড করা
      - name: Build Android Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'aimshot2026pass' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'aimshot-release-key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'aimshot2026pass' }}
        run: |
          if [ -d "AimShot_Project" ] && [ -f "AimShot_Project/settings.gradle" ]; then
            cd AimShot_Project
            if [ -f "./gradlew" ]; then
              ./gradlew assembleRelease assembleDebug --stacktrace
            else
              gradle assembleRelease assembleDebug --stacktrace
            fi
          elif [ -f "settings.gradle" ]; then
            ./gradlew assembleRelease assembleDebug --stacktrace
          else
            gradle assembleRelease assembleDebug --stacktrace
          fi

      # ৫.৫. জেনারেটেড রিলিজ এপিকে-এর SHA-256 হ্যাশ গণনা ও লগ করা
      - name: Calculate and Record Release SHA-256 Hashes
        run: |
          echo "=== AIMSHOT ENGINE RELEASE APK INTEGRITY DIGESTS ==="
          find . -name "*release*.apk" -exec sha256sum {} + || true
          find . -name "*debug*.apk" -exec sha256sum {} + || true
          echo "====================================================="

      # ৬. জেনারেটেড এপিকে ফাইল খুঁজে বের করা ও আর্কিটেক্ট হিসেবে আপলোড করা
      - name: Locate and Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimShot-Engine-Release-APK
          path: |
            AimShot_Project/app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Locate and Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimShot-Engine-Debug-APK
          path: |
            AimShot_Project/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
