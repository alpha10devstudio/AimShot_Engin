plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alpha10.aimshot'
    compileSdk 34

    defaultConfig {
        applicationId "com.alpha10.aimshot.launcher"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProps = new Properties()
        def localPropsFile = rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            localPropsFile.withInputStream { localProps.load(it) }
        }
        def authUrl = System.getenv("ALPHA10_AUTH_URL") ?: localProps.getProperty("ALPHA10_AUTH_URL", "https://alpha10.freedev.app/api/auth.php")
        def secretAppKey = System.getenv("ALPHA10_SECRET_APP_KEY") ?: localProps.getProperty("ALPHA10_SECRET_APP_KEY", "856b5c17909bcab591c7a41f3eb427296210e007889b2a595817a26596c62a10")
        def mainApkSha = System.getenv("MAIN_APK_SHA256") ?: localProps.getProperty("MAIN_APK_SHA256", "")

        buildConfigField "String", "ALPHA10_AUTH_URL", "\"${authUrl}\""
        buildConfigField "String", "ALPHA10_SECRET_APP_KEY", "\"${secretAppKey}\""
        buildConfigField "String", "MAIN_APK_SHA256", "\"${mainApkSha}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: "${rootDir}/keystore/aimshot-release.p12"
            def releaseStoreFile = file(keystorePath)
            if (releaseStoreFile.exists()) {
                storeFile releaseStoreFile
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "aimshot2026pass"
                keyAlias System.getenv("KEY_ALIAS") ?: "aimshot-release-key"
                keyPassword System.getenv("KEY_PASSWORD") ?: "aimshot2026pass"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.play:integrity:1.4.0'

    // Testing dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
